[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
description = "RuleSentry scanner: finds sensitive spans in text by rule, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No crate yet
        if: hashFiles('scanner/Cargo.toml') == ''
        run: echo "scanner/Cargo.toml absent; nothing to check"
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('scanner/Cargo.toml') != ''
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Test
        if: hashFiles('scanner/Cargo.toml') != ''
        working-directory: scanner
        run: cargo test
      - name: Clippy
        if: hashFiles('scanner/Cargo.toml') != ''
        working-directory: scanner
        run: cargo clippy -- -D warnings
      - name: Install wasm-pack
        if: hashFiles('scanner/Cargo.toml') != ''
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build WebAssembly
        if: hashFiles('scanner/Cargo.toml') != ''
        working-directory: scanner
        run: wasm-pack build --target web
      - uses: actions/upload-artifact@v4
        if: hashFiles('scanner/Cargo.toml') != ''
        with:
          name: scanner-pkg
          path: scanner/pkg

  web:
    runs-on: ubuntu-latest
    needs: scanner
    steps:
      - uses: actions/checkout@v4
      - name: No page yet
        if: hashFiles('web/package.json') == ''
        run: echo "web/package.json absent; nothing to check"
      - uses: actions/download-artifact@v4
        if: hashFiles('web/package.json') != '' && hashFiles('scanner/Cargo.toml') != ''
        with:
          name: scanner-pkg
          path: scanner/pkg
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: Lint
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run lint
      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('web/package.json') != ''
        with:
          path: web/dist

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: No page yet
        if: hashFiles('web/package.json') == ''
        run: echo "web/package.json absent; nothing to deploy"
      - id: deploy
        if: hashFiles('web/package.json') != ''
        uses: actions/deploy-pages@v4
